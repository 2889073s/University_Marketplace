{% extends "marketplace/base.html" %}

{% block title_block %}
    Delete product
{% endblock %}

{% block body_block %}
<div class="container my-5 text-center">
    <h2 class="text-danger mb-4">Delete Product</h2>
    {% if product %}
        <div class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
            <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger mt-3">Yes, Delete</button>
                <a href="{% url 'marketplace:profile_page' %}" class="btn btn-secondary mt-3">Cancel</a>
            </form>
        </div>
    {% else %}
        <p class="text-muted">Product not found.</p>
    {% endif %}
</div>
{% endblock %}
