{% extends "marketplace/base.html" %}

{% block title_block %}
    Leave a review
{% endblock %}

{% block body_block %}
<div class="container my-5">
    <h2 class="text-center text-primary mb-4">Leave a Review</h2>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success btn-block mt-3">
                        Submit Review
                    </button>
                    <a href="{% url 'marketplace:profile_page' %}" class="btn btn-secondary btn-block mt-2">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
