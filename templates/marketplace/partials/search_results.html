{% if products %}
    {% for product in products %}
        <div style="margin-bottom: 20px;">
            <h3>
                <a href="{% url 'marketplace:product_page' product.seller.slug product.slug %}">
                    {{ product.name }}
                </a>
            </h3>

            <p>{{ product.description }}</p>
            <p>Price: £{{ product.price }}</p>
            <p>Tag: {{ product.tag.tag_name }}</p>
            <p>
                Seller:
                <a href="{% url 'marketplace:seller_page' product.seller.slug %}">
                    {{ product.seller.user.username }}
                </a>
            </p>

            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}" width="200">
            {% endif %}
        </div>
        <hr>
    {% endfor %}
{% else %}
    <p>No products found.</p>
{% endif %}
