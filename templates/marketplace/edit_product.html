{% extends "marketplace/base.html" %}

{% block title_block %}
    Edit product
{% endblock %}

{% block body_block %}
        <h1>Edit product</h1>
        <div>
            {% if product %}
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Save</button>
                </form>
             {% else %}
                <p> product not found </p>
            {% endif %}
        </div>


{% endblock %}
