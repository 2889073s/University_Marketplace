{% extends "marketplace/base.html" %}

{% block title_block %}
    Edit product
{% endblock %}

{% block body_block %}
<div class="container my-5">
    <h2 class="text-center text-primary mb-4">Edit Product</h2>
    {% if product %}
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success btn-block bt-3">Save Changes</button>
                        <a href="{% url 'marketplace:profile_page' %}" class="btn btn-secondary btn-block mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    {% else %}
        <p class="text-center text-muted">Product not found.</p>
    {% endif %}
</div>
{% endblock %}
